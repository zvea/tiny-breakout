# Tiny Tapeout project information
project:
  title:        "Tiny Breakout"      # Project title
  author:       "Alexei Zverovitch"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Brick-breaker game with VGA output and SNES gamepad input"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     25175000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tiny_breakout"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # test/Makefile, the system tests, sim/play and tools/ read this list.
  source_files:
    - "colour_pkg.sv"       # packages first
    - "gamepad_pkg.sv"
    - "gamepad_rx.sv"
    - "vga_timing.sv"
    - "lfsr.sv"
    - "autoplay.sv"
    - "wall_pattern.sv"
    - "brick_wall.sv"
    - "score.sv"
    - "tiny_vga_out.sv"
    - "tt_um_tiny_breakout.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "left button"
  ui[1]: "right button"
  ui[2]: "fire button"
  ui[3]: "autoplay"
  ui[4]: "gamepad latch"
  ui[5]: "gamepad clk"
  ui[6]: "gamepad data"
  ui[7]: ""

  # Outputs
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSync"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
