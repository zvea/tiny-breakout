name: test
on: [push, workflow_dispatch]
permissions:
  contents: read
# A newer push to the same branch replaces a run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Lint the design: any Verilator warning fails the job. A job of its own, so the tests
  # still run (and report) when it fails.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install verilator
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Lint
        shell: bash
        run: |
          verilator --version
          SOURCES=$(sed -n 's/^ *- "\([A-Za-z0-9_]*\.sv\)".*/\1/p' info.yaml | sed 's|^|src/|')
          verilator --lint-only -Wall --top-module tt_um_tiny_breakout $SOURCES

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Tiny Tapeout's own build of Icarus 13.0, as its gate-level test (tt-gds-action's
      # gl_test) installs it, so the RTL tests here run on the same simulator (Ubuntu's is 12)
      - name: Install iverilog
        shell: bash
        run: |
          wget -q https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb
          iverilog -V 2>&1 | head -1

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        id: python-packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the tests fail, so check results.xml for failed tests
          python -m cocotb_tools.check_results results.xml

      # Also when the full-chip tests failed, but not without the Python packages
      - name: Run unit tests
        if: (success() || failure()) && steps.python-packages.outcome == 'success'
        run: SIM=icarus pytest test/unit --junitxml=test/unit/results.xml

      # The unit tests' cocotb cases are in test/unit/*.result.xml (one file per module);
      # pytest's results.xml has one entry per module, which also catches a build failure
      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: |
            test/results.xml
            test/unit/*.result.xml
            test/unit/results.xml
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/unit/*.xml
