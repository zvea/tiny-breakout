name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog and verilator
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator

      # Lint the design: any Verilator warning fails the job
      - name: Lint
        shell: bash
        run: |
          verilator --version
          SOURCES=$(sed -n 's/^ *- "\([A-Za-z0-9_]*\.sv\)".*/\1/p' info.yaml | sed 's|^|src/|')
          verilator --lint-only -Wall --top-module tt_um_tiny_breakout $SOURCES
          verilator --lint-only -Wall --top-module tt_um_tiny_breakout +define+TB_SOUND $SOURCES  # with sound

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the tests fail, so check results.xml for failed tests
          python -m cocotb_tools.check_results results.xml

      - name: Run unit tests
        if: success() || failure()
        run: SIM=icarus pytest test/unit --junitxml=test/unit/results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: |
            test/results.xml
            test/unit/results.xml
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
