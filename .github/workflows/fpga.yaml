name: fpga

on: [push, workflow_dispatch]

permissions:
  contents: read

# A newer push to the same branch replaces a run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The FPGA boards (fpga/<board>): every board's bitstream, in one job so that they go into one
# download, tiny-breakout-fpga-<short commit> (fpga/tools/package.sh); and each board's test,
# and the packaging's, as jobs of their own
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo (with the Tang Nano's hdl-util/hdmi)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: fpga/*/tools/requirements.txt

      # Each board's own .venv, as its README sets it up
      - name: Install the boards' tools
        id: tools
        run: |
          for board in fabricfox icebreaker tang_nano_20k; do
            python -m venv fpga/$board/.venv
            fpga/$board/.venv/bin/pip install -r fpga/$board/tools/requirements.txt
          done

      # A step for each board, each run even when one before it failed, so that each reports
      # (once the tools are in). nextpnr fails a build if timing does.
      - name: FabricFox
        run: fpga/fabricfox/tools/build.sh

      - name: iCEBreaker
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: fpga/icebreaker/tools/build.sh

      - name: Tang Nano 20K
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: fpga/tang_nano_20k/tools/build.sh

      - name: Package
        id: package
        run: |
          folder=$(fpga/tools/package.sh dist "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY")
          echo "name=$(basename "$folder")" >> "$GITHUB_OUTPUT"

      # dist/ holds the one folder, so the zip has it at the top
      - name: Upload the bitstreams
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/
          if-no-files-found: error

      # With no package, the logs of the boards that got that far, to see what failed
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fpga-logs-${{ github.sha }}
          path: fpga/*/build/*.log

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fabricfox
            run: fpga/fabricfox/test/run.sh
          - name: icebreaker
            run: fpga/icebreaker/test/run.sh
            verilator: true
          - name: tang_nano_20k
            run: fpga/tang_nano_20k/test/run.sh
            verilator: true
          - name: package
            run: fpga/test/package_test.sh
    steps:
      - name: Checkout repo (with the Tang Nano's hdl-util/hdmi)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install verilator
        if: ${{ matrix.verilator }}
        run: |
          sudo apt-get update && sudo apt-get install -y verilator
          verilator --version

      - name: Test
        run: ${{ matrix.run }}
