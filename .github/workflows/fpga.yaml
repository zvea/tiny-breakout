name: fpga

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fpga:
    runs-on: ubuntu-24.04
    env:
      # Place and route against the clock the board supplies (640x480 at 60 Hz), not the tool's
      # 12 MHz default, so a change that slows the design below it fails here; and with a fixed
      # seed, so a bitstream that passed rebuilds the same
      TT_FPGA_FREQ: "25.175"
      TT_FPGA_SEED: "10"
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: FPGA bitstream for TT ASIC Sim (ICE40UP5K)
        uses: TinyTapeout/tt-gds-action/fpga/ice40up5k@ttsky26e
