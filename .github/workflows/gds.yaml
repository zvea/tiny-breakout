name: gds

on:
  push:
  workflow_dispatch:

# Tiny Tapeout's template, plus these two settings. The viewer job widens its own permissions.
permissions:
  contents: read

# A newer push to the same branch replaces a run still going, so back-to-back pushes don't
# queue up 15-minute hardens (or precheck runs, whose Nix setup downloads nixpkgs from GitHub,
# which rate-limits it: HTTP 429). Cancelling can stop the viewer mid-deploy; deploy-pages then
# cancels that Pages deployment, the site keeps the one before, and the newer run deploys its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26e
        with:
          pdk: sky130A

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26e

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26e

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26e
