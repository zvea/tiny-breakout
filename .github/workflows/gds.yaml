name: gds

on:
  push:
  workflow_dispatch:

# Tiny Tapeout's template, plus these two settings, without its viewer job: site.yaml publishes
# the 3D viewer, with the tutorials, after each successful run on main.
permissions:
  contents: read

# A newer push to the same branch replaces a run still going, so back-to-back pushes don't
# queue up 15-minute hardens (or precheck runs, whose Nix setup downloads nixpkgs from GitHub,
# which rate-limits it: HTTP 429).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26e
        with:
          pdk: sky130A

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26e

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26e
