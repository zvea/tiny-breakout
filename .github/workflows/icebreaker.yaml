name: icebreaker

on: [push, workflow_dispatch]

permissions:
  contents: read

# A newer push to the same branch replaces a run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The iCEBreaker build (fpga/icebreaker): the bitstream, and the simulation test, as jobs of
# their own so each reports even when the other fails
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: fpga/icebreaker/tools/requirements.txt

      # The board's own .venv, as fpga/icebreaker/README.md sets it up
      - name: Install the board's tools
        run: |
          python -m venv fpga/icebreaker/.venv
          fpga/icebreaker/.venv/bin/pip install -r fpga/icebreaker/tools/requirements.txt

      # nextpnr fails the build if timing fails
      - name: Build the bitstream
        run: fpga/icebreaker/tools/build.sh

      - name: Upload the bitstream
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpga_icebreaker_bitstream
          path: |
            fpga/icebreaker/build/icebreaker.bin
            fpga/icebreaker/build/*.log

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Simulation test
        run: |
          verilator --version
          fpga/icebreaker/test/run.sh
