name: gowin

on: [push, workflow_dispatch]

permissions:
  contents: read

# A newer push to the same branch replaces a run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Tang Nano 20K build (fpga/tang_nano_20k): the bitstream, and the simulation test, as jobs
# of their own so each reports even when the other fails
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo (with hdl-util/hdmi)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: fpga/tang_nano_20k/tools/requirements.txt

      # The board's own .venv, as fpga/tang_nano_20k/README.md sets it up
      - name: Install the board's tools
        run: |
          python -m venv fpga/tang_nano_20k/.venv
          fpga/tang_nano_20k/.venv/bin/pip install -r fpga/tang_nano_20k/tools/requirements.txt

      # nextpnr fails the build if timing fails
      - name: Build the bitstream
        run: fpga/tang_nano_20k/tools/build.sh

      - name: Upload the bitstream
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpga_tang_nano_20k_bitstream
          path: |
            fpga/tang_nano_20k/build/tn20k.fs
            fpga/tang_nano_20k/build/*.log

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo (with hdl-util/hdmi)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Simulation test
        run: |
          verilator --version
          fpga/tang_nano_20k/test/run.sh
