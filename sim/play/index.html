<html><head><meta charset="utf-8"><title>Tiny Breakout (RTL sim)</title>
<style>
 body{background:#111;color:#ccc;font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;margin:16px}
 canvas{image-rendering:pixelated;width:960px;max-width:100%;border:1px solid #333}
 #s{margin:8px;font-variant-numeric:tabular-nums}
 kbd{background:#333;border-radius:3px;padding:1px 5px}
 #snd{display:flex;gap:10px;align-items:center;margin:8px}
 button{background:#333;color:#ddd;border:1px solid #555;border-radius:4px;padding:4px 10px;font:inherit;cursor:pointer}
 button:focus-visible,input:focus-visible{outline:2px solid #6af}
 #sb{display:inline-flex;padding:4px 8px}
 #sb[aria-pressed=true] .on,#sb[aria-pressed=false] .off{display:none}
 #snd.muted label{color:#666}
 input:disabled{opacity:.4;cursor:default}
</style></head><body>
<canvas id="c" width="640" height="480" role="img" aria-label="Tiny Breakout game screen"></canvas>
<div id="s" role="status">connecting…</div>
<div id="snd" class="muted"><button id="sb" aria-label="Mute" aria-pressed="true" title="Unmute (M)">
 <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 9v6h4l5 4V5L7 9z" fill="currentColor"/>
  <path class="on" d="M15.5 9a4 4 0 0 1 0 6M18.5 6a8 8 0 0 1 0 12"/>
  <path class="off" d="M16 9l6 6M22 9l-6 6"/></svg></button>
 <label for="vol">Volume</label><input id="vol" type="range" min="0" max="1" step="0.01" value="0.3" disabled></div>
<div id="help"><kbd>←</kbd>/<kbd>→</kbd> move &nbsp; <kbd>Space</kbd> launch / restart &nbsp; <kbd>A</kbd> autoplay (arrows stop it) &nbsp; <kbd>R</kbd> reset &nbsp; <kbd>M</kbd> <span id="mk">unmute</span></div>
<script>
// The server runs the RTL model at 60 fps and streams frames:
// [u32 video length][u32 audio samples][video: RLE (count, RRGGBB) pairs][audio: s16 at 48 kHz].
// One viewer at a time: when another tab connects, this one gets a video length of 0xFFFFFFFF
// and the stream ends; it then stops (reconnecting would take the stream back, and so on).
// Key changes are sent separately, so the frame rate does not depend on the network round trip.
const c=document.getElementById('c'),ctx=c.getContext('2d'),img=ctx.createImageData(640,480),st=document.getElementById('s');
const lv=[0,85,170,255];
let keys=0,auto=0,n=0,t0=performance.now(),latest=null,taken=false;
// The status line: the stream's state, then a sound problem if there is one
let line=st.textContent;
function showStatus(){st.textContent=line+(soundErr?` · ${soundErr}`:'')}

// Key changes go one request at a time, so they reach the server in order; changes made while
// one is on its way are sent as one, the newest state (keeping a reset, bit 16, until sent).
let keyBusy=false,keyNext=null;
function sendKeys(extra=0){
 if(taken)return;
 keyNext=keys|(auto<<3)|extra|(keyNext&16);
 if(!keyBusy)sendNextKeys();
}
async function sendNextKeys(){
 keyBusy=true;
 while(keyNext!==null){const k=keyNext;keyNext=null;
  try{await fetch(`/keys?k=${k}`,{signal:AbortSignal.timeout(2000)})}catch(e){}}
 keyBusy=false;
}
const map={ArrowLeft:1,ArrowRight:2,' ':4};
addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;  // browser shortcuts: Ctrl/Cmd+R reloads, Cmd+M minimises
 const k=e.key;
 if(k==='m'||k==='M'){if(!e.repeat)toggleSound();return}  // a held A, R or M acts once
 if(e.target.closest?.('input,button'))return;  // a focused slider or button keeps its keys
 if(map[k]){e.preventDefault();if(k!==' ')auto=0;  // steering takes over from autoplay
  if(!(keys&map[k])){keys|=map[k];sendKeys()}}
 else if(e.repeat)return;
 else if(k==='a'||k==='A'){auto^=1;sendKeys()}
 else if(k==='r'||k==='R'){sendKeys(16)}});
addEventListener('keyup',e=>{if(keys&map[e.key]){keys&=~map[e.key];sendKeys()}});
addEventListener('blur',()=>{keys=0;sendKeys()});

// --- Sound: the frames' samples (48 kHz, from the server) go into an AudioWorklet ring buffer.
// The worklet plays the 48 kHz stream at whatever rate the browser's audio runs (often 44.1
// kHz on a Mac), resampling with linear interpolation. It holds the buffer's low point (what is
// left when the next frame's samples arrive) near 60 ms: it plays up to 1% faster or slower
// (too little to hear) as that runs over or under, so the delay can't creep up with clock
// drift. The low point, not the fill at any moment, because a slow machine sends each frame's
// stretched samples at once (a fifth of a second of them at 5 fps), and the buffer must last
// until the next frame's arrive.
// Playback starts once 60 ms is in; a buffer still far overfull when samples arrive (a
// stall), or a burst that would overrun it, jumps to the target, and a dry one pauses until
// refilled.
const worklet=`const T=2880;class Feed extends AudioWorkletProcessor{
 constructor(){super();this.buf=new Float32Array(48000);this.r=0;this.w=0;this.lo=0;this.playing=false;
  this.base=48000/sampleRate;
  this.port.onmessage=e=>{const s=e.data,N=this.buf.length,f=this.fill();
   if(s==='clear'){this.r=this.w=0;this.playing=false;return}  // muted: drop what is left
   this.lo=f;
   for(let i=0;i<s.length;i++){this.buf[this.w]=s[i];this.w=(this.w+1)%N}
   if(f>4*T||f+s.length>=N-1){this.r=(this.w-T+N)%N;this.lo=T}}}
 fill(){const N=this.buf.length;return (this.w-Math.floor(this.r)+N)%N}
 process(_,outs){const o=outs[0][0],N=this.buf.length;
  if(!this.playing&&this.fill()>=T)this.playing=true;
  const step=this.base*(1+0.01*Math.max(-1,Math.min(1,(this.lo-T)/T)));
  for(let i=0;i<o.length;i++){
   if(this.playing&&this.fill()>2){const i0=Math.floor(this.r),a=this.buf[i0],b=this.buf[(i0+1)%N];
    o[i]=a+(b-a)*(this.r-i0);this.r+=step;if(this.r>=N)this.r-=N}
   else{o[i]=0;this.playing=false}}
  this.port.postMessage(this.fill());return true}}
registerProcessor('feed',Feed);`;
let actx=null,node=null,gain=null,soundOn=false,soundBusy=null,soundErr='',buffered=0;
const sb=document.getElementById('sb'),vol=document.getElementById('vol');
// One change at a time: a press while the sound is starting or stopping is ignored
function toggleSound(){
 if(!soundBusy)soundBusy=setSound(!soundOn).finally(()=>{soundBusy=null});
 return soundBusy;
}
async function setSound(on){
 try{
  if(on&&!actx){  // first time: set up the worklet, keeping nothing if that fails
   const ac=new AudioContext({latencyHint:'interactive'});
   const url=URL.createObjectURL(new Blob([worklet],{type:'text/javascript'}));
   try{
    await ac.audioWorklet.addModule(url);
    node=new AudioWorkletNode(ac,'feed',{outputChannelCount:[1]});
    gain=ac.createGain();gain.gain.value=+vol.value;
    node.connect(gain).connect(ac.destination);
    node.port.onmessage=e=>{buffered=e.data};
   }catch(e){ac.close().catch(()=>{});throw e}
   finally{URL.revokeObjectURL(url)}
   actx=ac;
  }
  if(on){await actx.resume();soundOn=true}
  else{soundOn=false;node.port.postMessage('clear');await actx.suspend()}  // an unmute plays only new sound
  soundErr='';
 }catch(e){
  console.warn('sound:',e);
  soundErr=on?'sound failed to start':'sound failed to stop';
 }
 showStatus();
 // The button shows the state (crossed out when muted); the slider is off while muted
 sb.setAttribute('aria-pressed',String(!soundOn));
 sb.title=soundOn?'Mute (M)':'Unmute (M)';
 document.getElementById('mk').textContent=soundOn?'mute':'unmute';
 document.getElementById('snd').classList.toggle('muted',!soundOn);
 vol.disabled=!soundOn;
}
sb.addEventListener('click',toggleSound);
// Used with the mouse, the controls hand the keys back to the game (Tab still reaches them)
addEventListener('pointerup',()=>{const a=document.activeElement;if(a===sb||a===vol)a.blur()});
// The volume is remembered across reloads, where the browser allows storage
try{const v=localStorage.getItem('tb-volume');if(v!==null)vol.value=v}catch(e){}
vol.addEventListener('input',()=>{
 if(gain)gain.gain.value=+vol.value;
 try{localStorage.setItem('tb-volume',vol.value)}catch(e){}});
function playAudio(bytes){
 if(!soundOn||!node)return;
 const s=new Int16Array(bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.length));
 const f=new Float32Array(s.length);for(let i=0;i<s.length;i++)f[i]=s[i]/32768;
 node.port.postMessage(f,[f.buffer]);
}

function draw(b){
 const d=img.data;let p=0;
 for(let i=0;i<b.length;i+=2){const k=b[i],v=b[i+1],R=lv[v>>4&3],G=lv[v>>2&3],B=lv[v&3];
  for(let j=0;j<k;j++){d[p]=R;d[p+1]=G;d[p+2]=B;d[p+3]=255;p+=4}}
 ctx.putImageData(img,0,0);
}
function paint(){ // draw only the newest frame, once per display refresh
 if(latest){draw(latest);latest=null}
 requestAnimationFrame(paint);
}
requestAnimationFrame(paint);

async function stream(){
 for(;;){
  try{
   sendKeys();
   const r=await fetch('/stream',{cache:'no-store'});
   const rd=r.body.getReader();
   let buf=new Uint8Array(0);
   read: for(;;){
    const {value,done}=await rd.read();if(done)break;
    const nb=new Uint8Array(buf.length+value.length);nb.set(buf);nb.set(value,buf.length);buf=nb;
    while(buf.length>=8){
     const len=(buf[0]|buf[1]<<8|buf[2]<<16|buf[3]<<24)>>>0,ns=(buf[4]|buf[5]<<8|buf[6]<<16|buf[7]<<24)>>>0;
     if(len===0xFFFFFFFF){taken=true;break read}
     if(buf.length<8+len+2*ns)break;
     latest=buf.subarray(8,8+len);
     playAudio(buf.subarray(8+len,8+len+2*ns));
     buf=buf.slice(8+len+2*ns);n++;
    }
    const t=performance.now();
    // Every frame is simulated, none skipped: below 60 fps the game runs in slow motion, and
    // the server stretches the sound to match, at its true pitch
    if(t-t0>1000){const fps=n*1000/(t-t0);line=`${fps.toFixed(1)} fps · running at ${Math.round(fps/60*100)}% of real speed${auto?' · AUTOPLAY':''}${soundOn?` · sound buffer ${Math.round(buffered/48)} ms`:''}`;showStatus();n=0;t0=t}
   }
  }catch(e){}
  if(taken){line='taken over by another tab – reload to watch here';showStatus();return}
  line='disconnected – retrying…';showStatus();
  await new Promise(r=>setTimeout(r,1000));
 }
}
stream();
</script></body></html>
