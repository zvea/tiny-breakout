<html><head><meta charset="utf-8"><title>Tiny Breakout (RTL sim)</title>
<style>
 body{background:#111;color:#ccc;font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;margin:16px}
 canvas{image-rendering:pixelated;width:960px;max-width:100%;border:1px solid #333}
 #s{margin:8px;font-variant-numeric:tabular-nums}
 kbd{background:#333;border-radius:3px;padding:1px 5px}
 #snd{display:flex;gap:10px;align-items:center;margin:8px}
 button{background:#333;color:#ddd;border:1px solid #555;border-radius:4px;padding:4px 10px;font:inherit;cursor:pointer}
 button:focus-visible,input:focus-visible{outline:2px solid #6af}
</style></head><body>
<canvas id="c" width="640" height="480"></canvas>
<div id="s">connecting…</div>
<div id="snd"><button id="sb">Turn sound on</button>
 <label for="vol">Volume</label><input id="vol" type="range" min="0" max="1" step="0.01" value="0.3"></div>
<div><kbd>←</kbd>/<kbd>→</kbd> move &nbsp; <kbd>Space</kbd> launch / restart &nbsp; <kbd>A</kbd> toggle autoplay &nbsp; <kbd>R</kbd> reset &nbsp; <kbd>M</kbd> sound on / off</div>
<script>
// The server runs the RTL model at 60 fps and streams frames:
// [u32 video length][u32 audio samples][video: RLE (count, RRGGBB) pairs][audio: s16 at 48 kHz].
// Key changes are sent separately, so the frame rate does not depend on the network round trip.
const c=document.getElementById('c'),ctx=c.getContext('2d'),img=ctx.createImageData(640,480),st=document.getElementById('s');
const lv=[0,85,170,255];
let keys=0,auto=0,n=0,t0=performance.now(),latest=null;

function sendKeys(extra=0){fetch(`/keys?k=${keys|(auto<<3)|extra}`).catch(()=>{})}
const map={ArrowLeft:1,ArrowRight:2,' ':4};
addEventListener('keydown',e=>{
 if(map[e.key]){e.preventDefault();if(!(keys&map[e.key])){keys|=map[e.key];sendKeys()}}
 else if(e.key==='a'||e.key==='A'){auto^=1;sendKeys()}
 else if(e.key==='r'||e.key==='R'){sendKeys(16)}
 else if(e.key==='m'||e.key==='M'){toggleSound()}});
addEventListener('keyup',e=>{if(map[e.key]){keys&=~map[e.key];sendKeys()}});
addEventListener('blur',()=>{keys=0;sendKeys()});

// --- Sound: the frames' samples (48 kHz, from the server) go into an AudioWorklet ring buffer.
// The worklet plays the 48 kHz stream at whatever rate the browser's audio runs (often 44.1
// kHz on a Mac), resampling with linear interpolation, and holds its buffer near 60 ms: it
// plays up to 1% faster or slower (too little to hear) as the buffer runs over or under, so
// the delay can't creep up with clock drift. Playback starts once 60 ms is in; a far
// overfull buffer (a stall) jumps to the target, and a dry one pauses until refilled.
const worklet=`class Feed extends AudioWorkletProcessor{
 constructor(){super();this.buf=new Float32Array(48000);this.r=0;this.w=0;this.playing=false;
  this.base=48000/sampleRate;
  this.port.onmessage=e=>{const s=e.data,N=this.buf.length;
   for(let i=0;i<s.length;i++){this.buf[this.w]=s[i];this.w=(this.w+1)%N}}}
 fill(){const N=this.buf.length;return (this.w-Math.floor(this.r)+N)%N}
 process(_,outs){const o=outs[0][0],N=this.buf.length,T=2880;let f=this.fill();
  if(f>4*T){this.r=(this.w-T+N)%N;f=T}
  if(!this.playing&&f>=T)this.playing=true;
  const step=this.base*(1+0.01*Math.max(-1,Math.min(1,(f-T)/T)));
  for(let i=0;i<o.length;i++){
   if(this.playing&&this.fill()>2){const i0=Math.floor(this.r),a=this.buf[i0],b=this.buf[(i0+1)%N];
    o[i]=a+(b-a)*(this.r-i0);this.r+=step;if(this.r>=N)this.r-=N}
   else{o[i]=0;this.playing=false}}
  this.port.postMessage(this.fill());return true}}
registerProcessor('feed',Feed);`;
let actx=null,node=null,gain=null,soundOn=false,buffered=0;
const sb=document.getElementById('sb'),vol=document.getElementById('vol');
async function toggleSound(){
 if(!actx){
  actx=new AudioContext({latencyHint:'interactive'});
  await actx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet],{type:'text/javascript'})));
  node=new AudioWorkletNode(actx,'feed',{outputChannelCount:[1]});
  gain=actx.createGain();gain.gain.value=+vol.value;
  node.connect(gain).connect(actx.destination);
  node.port.onmessage=e=>{buffered=e.data};
 }
 soundOn=!soundOn;
 if(soundOn)await actx.resume();else await actx.suspend();
 sb.textContent=soundOn?'Turn sound off':'Turn sound on';
}
sb.addEventListener('click',toggleSound);
vol.addEventListener('input',()=>{if(gain)gain.gain.value=+vol.value});
function playAudio(bytes){
 if(!soundOn||!node)return;
 const s=new Int16Array(bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.length));
 const f=new Float32Array(s.length);for(let i=0;i<s.length;i++)f[i]=s[i]/32768;
 node.port.postMessage(f,[f.buffer]);
}

function draw(b){
 const d=img.data;let p=0;
 for(let i=0;i<b.length;i+=2){const k=b[i],v=b[i+1],R=lv[v>>4&3],G=lv[v>>2&3],B=lv[v&3];
  for(let j=0;j<k;j++){d[p]=R;d[p+1]=G;d[p+2]=B;d[p+3]=255;p+=4}}
 ctx.putImageData(img,0,0);
}
function paint(){ // draw only the newest frame, once per display refresh
 if(latest){draw(latest);latest=null}
 requestAnimationFrame(paint);
}
requestAnimationFrame(paint);

async function stream(){
 for(;;){
  try{
   sendKeys();
   const r=await fetch('/stream',{cache:'no-store'});
   const rd=r.body.getReader();
   let buf=new Uint8Array(0);
   for(;;){
    const {value,done}=await rd.read();if(done)break;
    const nb=new Uint8Array(buf.length+value.length);nb.set(buf);nb.set(value,buf.length);buf=nb;
    while(buf.length>=8){
     const len=(buf[0]|buf[1]<<8|buf[2]<<16|buf[3]<<24)>>>0,ns=(buf[4]|buf[5]<<8|buf[6]<<16|buf[7]<<24)>>>0;
     if(buf.length<8+len+2*ns)break;
     latest=buf.subarray(8,8+len);
     playAudio(buf.subarray(8+len,8+len+2*ns));
     buf=buf.slice(8+len+2*ns);n++;
    }
    const t=performance.now();
    // Every frame is simulated, none skipped: below 60 fps the game runs in slow motion, and
    // the server stretches the sound to match, at its true pitch
    if(t-t0>1000){const fps=n*1000/(t-t0);st.textContent=`${fps.toFixed(1)} fps · running at ${Math.round(fps/60*100)}% of real speed${auto?' · AUTOPLAY':''}${soundOn?` · sound buffer ${Math.round(buffered/48)} ms`:''}`;n=0;t0=t}
   }
  }catch(e){}
  st.textContent='disconnected – retrying…';
  await new Promise(r=>setTimeout(r,1000));
 }
}
stream();
</script></body></html>
