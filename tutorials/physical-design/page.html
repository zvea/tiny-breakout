<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Breakout Physical Design</title>
<script>
// the theme before the first paint: the saved choice, else the system's
(function () {
  var t = null;
  try { t = window.localStorage.getItem("tb-die-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One screen: the die on the left (canvas, zoom and pan, the legend above it, the play bar and
   scale below it, the steps along its foot), the current step's explanation on the right.
   Each colour keeps its meaning from step to step; whatever is not the current step's subject
   is greyed out. Laptop and tablet first; on a phone the panels stack. */
:root {
  --bg: #ffffff;
  --ink: #1b1d1f;
  --muted: #5d6369;
  --rule: #c9cdd1;
  --bar: #eef0f2;
  --focus: #1a56c4;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* the die */
  --stage: #f3f4f6;
  --veil: rgba(243, 244, 246, 0.86);
  --die: #d9dde2;
  --die-edge: #7d8792;
  --core: #fbfbfc;
  --row: #eef1f4;
  --row-flip: #dce3eb;
  --row-edge: #c4ccd5;
  --site: rgba(60, 72, 86, 0.22);
  --dim: #3a4250;
  --tap: #4d5b6b;
  --endcap: #9aa6b3;
  --swatch-edge: rgba(20, 26, 33, 0.35);
  --vpwr: #d0453a;
  --vgnd: #2f63c4;
  --via: #1f2630;
  --pin: #1b1d1f;
  /* cells */
  --logic: #e3c47e;
  --ff: #2f9a8b;
  --buf: #d64f98;
  --tie: #8d8a33;
  --clock: #ef7d1a;
  --clknet: #c4600c;
  --hold: #7a4f2e;
  --diode: #b8860b;
  --decap: #5b7fa6;
  --fill: #8c99a6;
  --pick: #1b1d1f;
  --setup: #e4572e;
  --holdp: #7b2fd6;
  /* GDS layers below the metals */
  --nwell: #8bc34a;
  --diff: #a39a35;
  --gtap: #615a1c;
  --poly: #9c1b34;
  --cut: #1f2630;
  /* IR drop, low to high */
  --ir0: #f7fcb9;
  --ir1: #addd8e;
  --ir2: #41ab5d;
  --ir3: #005a32;
  /* crowding: overfull placement bins, nets per g-cell */
  --hot: #8a2be2;
  /* routing layers */
  --li1: #a39ad0;
  --met1: #2b9fd8;
  --met2: #e0458f;
  --met3: #34a853;
  --met4: #e8a317;
  --wvia: #1f2630;
}
:root[data-theme="dark"] {
  --bg: #121416; --ink: #e4e6e8; --muted: #9aa0a6; --rule: #3d4247; --bar: #1d2125; --focus: #7fb0ff;
  --stage: #0d0f11; --veil: rgba(13, 15, 17, 0.86); --die: #2a2f35; --die-edge: #8a949f; --core: #1b1f23;
  --row: #22272c; --row-flip: #30373e; --row-edge: #3b434b; --site: rgba(200, 210, 222, 0.18); --dim: #c9d0d8;
  --tap: #a9b6c4; --endcap: #66717d; --swatch-edge: rgba(255, 255, 255, 0.3);
  --vpwr: #ff6b5e; --vgnd: #5f95ff; --via: #e9edf2; --pin: #f1f3f5;
  --logic: #b48f45; --ff: #4cc0ae; --buf: #ff86c4; --tie: #c9c56a; --clock: #ff9a3d; --clknet: #ffb067;
  --hold: #c08a5c; --diode: #e8b23a; --decap: #7fa3c9; --fill: #a7b3bf;
  --pick: #f1f3f5; --hot: #d27bff;
  --setup: #ff8a65; --holdp: #c48bff;
  --nwell: #6f9a3c; --diff: #c9bd5a; --gtap: #8c8433; --poly: #e0506a; --cut: #e9edf2;
  --ir0: #12301f; --ir1: #23733f; --ir2: #66bd63; --ir3: #d9f0a3;
  --li1: #8f86c0; --met1: #5cc0f5; --met2: #ff7ab4; --met3: #5fd27e; --met4: #ffc24a; --wvia: #e9edf2;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 13px; line-height: 1.45; }
button { font: inherit; color: inherit; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
.stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--stage); }
.view { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; }
.view.dragging { cursor: grabbing; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.view:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }

.zoom {
  position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 4px;
}
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0;
  color: var(--muted); background: var(--bg); cursor: pointer; border: 1px solid var(--rule); border-radius: 2px;
}
.iconbtn svg { width: 16px; height: 16px; display: block; }
.iconbtn:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
.iconbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.iconbtn:disabled { opacity: 0.4; cursor: default; }

/* the legend: along the top, in the order things appear, on a backdrop so it reads over the die */
.legend {
  position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50px; max-width: calc(100% - 64px);
  margin: 0; padding: 4px 8px; list-style: none; pointer-events: none; box-sizing: border-box;
  display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; white-space: nowrap;
  background: var(--veil); border-radius: 2px;
}
.legend:empty { display: none; }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend li.gone { visibility: hidden; }
.legend li.dimmed { color: var(--muted); }
.legend i { flex: none; width: 14px; height: 10px; border: 1px solid var(--swatch-edge); border-radius: 1px; transition: opacity 0.6s; }
.legend li.dimmed i { filter: grayscale(1); opacity: 0.4; }
.legend i.line { height: 0; border: 0; border-top: 2px solid; border-radius: 0; }
.legend i.lay { background: var(--c); }
.legend.gds i.lay { background: color-mix(in srgb, var(--c) 18%, transparent); border: 1.5px solid var(--c); }

/* the band along the foot of the view: scale and keys on the left, the play bar beside them */
.foot {
  position: absolute; bottom: 8px; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  display: flex; align-items: flex-end; gap: 16px; pointer-events: none;
}
.scale {
  flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
  background: var(--veil); padding: 3px 6px; border-radius: 2px;
}
.scale i { display: block; height: 6px; border: 1.5px solid var(--muted); border-top: 0; margin-bottom: 2px; }
.hint { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
.hint kbd { font: inherit; border: 1px solid var(--rule); border-radius: 2px; padding: 0 3px; }
.readout {
  pointer-events: auto; flex: 1; min-width: 0; max-width: 680px; margin-left: auto; display: flex; align-items: center; gap: 10px;
  padding: 5px 10px 5px 5px; background: var(--bg); border: 1px solid var(--rule); border-radius: 2px; font-size: 12px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.readout input { width: 130px; flex: none; accent-color: var(--ink); }
.readout .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.readout .what b { font-weight: 600; }

.tip {
  position: absolute; pointer-events: none; background: var(--bg); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 2px; padding: 5px 8px; font-size: 12px; line-height: 1.4; max-width: 300px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
}
.tip b { font-weight: 600; }
.tip .it { display: flex; gap: 7px; align-items: flex-start; }
.tip .it + .it { margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--rule); }
.tip .it.dimmed { color: var(--muted); }
.tip .sw { flex: none; width: 10px; height: 10px; margin-top: 3px; border: 1px solid var(--swatch-edge); border-radius: 1px; }
.tip code { font-family: var(--mono); font-size: 11.5px; }

/* the steps, along the foot of the die */
.steps {
  display: flex; align-items: center; gap: 8px; padding-block: 8px 10px; border-top: 1px solid var(--rule); background: var(--bg);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px;
}
.track { flex: 1; min-width: 0; display: flex; gap: 3px; }
.seg {
  flex: 1; min-width: 0; height: 30px; padding: 0 2px; border: 1px solid var(--rule); border-radius: 2px; background: var(--bar);
  cursor: pointer; font-size: 11px; color: var(--muted);
  display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap;
}
.seg .num { display: none; }
.track.numbered .seg .long { display: none; }
.track.numbered .seg .num { display: inline; }
.seg:hover { border-color: var(--muted); color: var(--ink); }
.seg:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.seg.done { background: var(--row-flip); color: var(--ink); }
.seg.now { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* the explanation */
aside {
  min-width: 0; min-height: 0; overflow-y: auto; border-left: 1px solid var(--rule);
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) 16px;
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px;
}
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 15px; font-weight: 600; margin: 0; }
.head p { margin: 0; color: var(--muted); font-size: 12px; }
.kicker { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; font-variant-numeric: tabular-nums; }
h2 { font-size: 19px; font-weight: 600; margin: 0 0 4px; line-height: 1.25; text-wrap: balance; }
.tool { margin: 0; font-size: 12px; color: var(--muted); }
.tool code { font-family: var(--mono); font-size: 11.5px; }
.body p { margin: 0 0 8px; }
.body h3 { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 12px 0 3px; }
.body code { font-family: var(--mono); font-size: 12px; }
.body a { color: inherit; text-underline-offset: 2px; }
/* what the picture shows, as opposed to what the tool does */
.body .note { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; }
.nav { display: flex; gap: 8px; }
.nav button {
  flex: 1; min-width: 0; height: 32px; border: 1px solid var(--rule); border-radius: 2px; background: var(--bg); cursor: pointer; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.nav button svg { width: 13px; height: 13px; flex: none; }
.nav button:hover:not(:disabled) { border-color: var(--muted); }
.nav button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.nav button:disabled { color: var(--muted); opacity: 0.5; cursor: default; }

/* short screens: a little tighter, so the panel still fits */
@media (max-height: 820px) and (min-width: 761px) {
  body { font-size: 12.5px; line-height: 1.4; }
  aside { gap: 9px; padding-block: 10px 10px; }
  h2 { font-size: 17px; }
  .body p { margin-bottom: 6px; }
  .body .note { font-size: 11.5px; }
}
/* laptops below 1400 px: the step names a little smaller, so none is clipped */
@media (max-width: 1400px) {
  .seg { font-size: 10.5px; padding: 0; }
  .track { gap: 2px; }
}
/* tablets in landscape: the play bar's text may take two lines */
@media (max-width: 1150px) and (min-width: 761px) {
  .readout { white-space: normal; }
  .readout .what { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
}
/* very short screens (1280 x 720 and less): tighter still */
@media (max-height: 740px) and (min-width: 761px) {
  body { font-size: 12px; line-height: 1.36; }
  aside { gap: 7px; padding-block: 8px 8px; }
  h2 { font-size: 16px; margin-bottom: 2px; }
  .body h3 { margin: 9px 0 2px; }
  .body .note { margin-top: 6px; padding-top: 6px; font-size: 11.5px; }
}
/* phones: the panels stack; keep it usable rather than polished */
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 62vh auto; height: auto; }
  .view { touch-action: pan-y; }
  aside { border-left: 0; border-top: 1px solid var(--rule); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .legend { flex-wrap: nowrap; overflow-x: auto; right: 10px; pointer-events: auto; scrollbar-width: none; }
  .legend li.dimmed, .legend li.gone { display: none; }
  .hint { display: none; }
  .foot { flex-wrap: wrap; }
  .readout { flex-basis: 100%; max-width: none; margin-left: 0; }
  .readout input { width: 90px; }
  .seg .long { display: none; }
  .seg .num { display: inline; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="view" id="view" tabindex="0" role="group" aria-label="The die: scroll or + and - to zoom, drag to move, arrow keys to step">
      <canvas id="canvas" role="img" aria-label="The die"></canvas>
      <div class="loading" id="loading">Loading the layout…</div>
      <div class="zoom">
        <button type="button" class="iconbtn" id="zin" aria-label="Zoom in (+)" title="Zoom in (+)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
        <button type="button" class="iconbtn" id="zout" aria-label="Zoom out (-)" title="Zoom out (-)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"/></svg></button>
        <button type="button" class="iconbtn" id="zfit" aria-label="Show the whole die (0)" title="Show the whole die (0)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
      </div>
      <ul class="legend" id="legend" aria-label="Legend"></ul>
      <div class="foot" id="foot">
        <div class="scale"><i id="scalebar"></i><span id="scaletext"></span>
          <p class="hint">Scroll to zoom, drag to move, <kbd>&larr;</kbd> <kbd>&rarr;</kbd> to step/play</p></div>
        <div class="readout" id="readout" hidden>
          <button type="button" class="iconbtn" id="play" aria-label="Play"></button>
          <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Progress through this step">
          <span class="what" id="what"></span>
        </div>
      </div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <nav class="steps" aria-label="Steps">
      <div class="track" id="track"></div>
    </nav>
  </main>
  <aside>
    <div class="head">
      <div>
        <h1>Tiny Breakout physical design</h1>
        <p>From an empty die to the finished GDS</p>
      </div>
      <button type="button" class="iconbtn" id="theme" aria-label="Switch theme"></button>
    </div>
    <section aria-live="polite">
      <p class="kicker" id="kicker"></p>
      <h2 id="title"></h2>
      <p class="tool" id="tool"></p>
    </section>
    <div class="nav">
      <button type="button" id="prev"><span aria-hidden="true">&larr; </span>Back</button>
      <button type="button" id="navplay" disabled></button>
      <button type="button" id="next">Next<span aria-hidden="true"> &rarr;</span></button>
    </div>
    <div class="body" id="body"></div>
  </aside>
</div>

<script>
var DATA_GZ = "/*DATA*/";
</script>
<script>
(function () {
  "use strict";
  // Theme: as the head set it (the saved choice, else the system's). The button shows the
  // theme it switches to.
  var themeBtn = document.getElementById("theme"), theme = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  var ICONS = {
    light: '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg>',
    dark: '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M13.6 9.6A5.6 5.6 0 0 1 6.4 2.4a5.6 5.6 0 1 0 7.2 7.2z"/></svg>'
  };
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    var next = theme === "dark" ? "light" : "dark";
    themeBtn.innerHTML = ICONS[next];
    themeBtn.setAttribute("aria-label", "Switch to " + next + " theme");
    themeBtn.title = "Switch to " + next + " theme";
    document.dispatchEvent(new Event("themechange"));
  }
  themeBtn.addEventListener("click", function () {
    theme = theme === "dark" ? "light" : "dark";
    try { window.localStorage.setItem("tb-die-theme", theme); } catch (err) {}
    applyTheme();
  });
  applyTheme();
})();

// The data travels gzipped and base64-encoded; the browser inflates it.
(function () {
  "use strict";
  var bin = atob(DATA_GZ), u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  if (typeof DecompressionStream === "undefined") {
    document.getElementById("loading").textContent = "This page needs a browser from 2023 or later (DecompressionStream).";
    return;
  }
  new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).text()
    .then(function (text) { document.getElementById("loading").remove(); start(JSON.parse(text)); })
    .catch(function (e) { document.getElementById("loading").textContent = "Could not read the layout data: " + e; });
})();

function start(D) {
  "use strict";
  // The steps, by name, in the flow's order
  var S = { DIE: 0, FLOOR: 1, TAPS: 2, PDN: 3, PINS: 4, PLACE: 5, REPAIR: 6, LEGAL: 7, CTS: 8, HOLD: 9,
            GRT: 10, ANT: 11, DRT: 12, FILL: 13, STA: 14, IR: 15, GDS: 16 };
  var U = D.units, SW = D.site[0], RH = D.site[1], DIE = D.die, CORE = D.core, NROWS = D.rows.length;
  function um(v) { return v / U; }
  function fmt(v, dp) { var t = v.toFixed(dp === undefined ? 2 : dp); return t.indexOf(".") < 0 ? t : t.replace(/\.?0+$/, ""); }
  function n(v) { return v.toLocaleString("en-GB"); }
  function clamp01(t) { return t < 0 ? 0 : t > 1 ? 1 : t; }
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  // An element added by step k appears while p runs from k-1 to k, staggered by s in [0, 1],
  // so stepping back plays it in reverse.
  function appear(p, k, s) { return clamp01((p - (k - 1) - s * 0.6) / 0.4); }
  // how far through step k position p is (0 before it, 1 after it)
  function within(p, k) { return clamp01(p - (k - 1)); }
  function hash01(i) { var h = Math.imul(i + 1, 2654435761) >>> 0; return (h % 1000) / 1000; }
  function shortName(t) { return t.replace("sky130_fd_sc_hd__", ""); }
  function plain(html) { return html.replace(/<[^>]+>/g, ""); }

  // ---- fixed cells, power grid, pins -------------------------------------------------------
  var fixed = D.fixed.map(function (c) { return { kind: c[0], type: D.types[c[1]], site: c[2], row: c[3], w: c[4], orient: c[5], name: c[6] }; });
  var nTap = 0, nEnd = 0;
  fixed.forEach(function (c) {
    if (c.kind === "tap") nTap++; else nEnd++;
    // endcaps first, then taps from left to right (the order tapcell inserts them)
    c.s = c.kind === "endcap" ? 0.25 * (c.row / NROWS) : 0.3 + 0.7 * (c.site / D.sitesPerRow);
  });
  var byRow = [];
  for (var r0 = 0; r0 < NROWS; r0++) byRow.push([]);
  fixed.forEach(function (c) { byRow[c.row].push(c); });

  STEPS[S.DIE] = { short: "Die", title: "The die area", tool: "Tiny Tapeout's 1×1 tile",
    body:
      "<p>The <b>die area</b> is fixed before the flow starts: one Tiny Tapeout tile, " + fmt(um(DIE[2])) + " × " + fmt(um(DIE[3])) + " µm (" + n(Math.round(um(DIE[2]) * um(DIE[3]))) + " µm²), set in the configuration and checked against Tiny Tapeout's tile template.</p>" +
      "<p>Synthesis has already mapped the RTL to a gate-level <b>netlist</b>: " + n(D.netlistCells) + " <b>instances</b> of standard cells from <code>sky130_fd_sc_hd</code>, SkyWater's 130 nm high-density library, and the <b>nets</b> that connect their pins. A netlist is connectivity only. <b>Physical design</b>, or place and route (PnR), decides where every instance and every wire goes.</p>",
    note: "Shows one run of the flow, in November 2026: <a href=\"https://github.com/zvea/tiny-breakout/tree/8e82a8f\">commit 8e82a8f</a>, LibreLane 3.0.14, sky130." };
  STEPS[S.FLOOR] = { short: "Floorplan", title: "Floorplan", tool: "OpenROAD <code>ifp</code>: <code>initialize_floorplan</code>",
    body:
      "<p>The <b>core area</b> is the die less a <b>core margin</b> (" + fmt(um(CORE[0])) + " µm left and right, " + fmt(um(CORE[1])) + " µm top and bottom). Standard cells may be placed only inside the core: " + fmt(um(CORE[2] - CORE[0])) + " × " + fmt(um(CORE[3] - CORE[1])) + " µm, or " + n(Math.round(um(CORE[2] - CORE[0]) * um(CORE[3] - CORE[1]))) + " µm². <b>Utilisation</b>, the cells' total area as a share of it, is the usual measure of how full a design is.</p>" +
      "<p>The core is divided into <b>placement rows</b>, " + NROWS + " of them, each " + D.sitesPerRow + " <b>sites</b> long. The site (<code>unithd</code>) is " + fmt(um(SW)) + " × " + fmt(um(RH)) + " µm. Every standard cell is one row high and a whole number of sites wide, so a legal placement gives each instance a row, a site and an orientation. The floorplan also lays out each layer's <b>routing tracks</b>, the lines wires will follow.</p>" +
      "<h3>How it works</h3>" +
      "<p>Rows alternate orientation: <b>N</b>, then <b>FS</b> (flipped about the x axis). A cell has its power rail (<code>VPWR</code>) along the top and its ground rail (<code>VGND</code>) along the bottom, with the PMOS transistors in an n-well under <code>VPWR</code>. Flipping alternate rows puts like rails back to back, so abutting rows share one rail, and the n-wells of each pair of rows merge. Nothing is optimised: the rows follow from the core size and the site.</p>" };
  STEPS[S.TAPS] = { short: "Taps", title: "Tap and endcap insertion", tool: "OpenROAD <code>tapcell</code>",
    body:
      "<p>Two kinds of physical-only cell go in before any logic, as <code>FIXED</code> instances that placement must work around.</p>" +
      "<p><b>Well taps</b> (" + n(nTap) + " × <code>tapvpwrvgnd_1</code>) tie the n-well to <code>VPWR</code> and the p-substrate to <code>VGND</code>. <code>sky130_fd_sc_hd</code> is a <b>tapless</b> library: its cells have no well or substrate contacts of their own. Far from a tap, current in the well and substrate can raise their potential until the parasitic PNPN thyristor of neighbouring PMOS and NMOS turns on and shorts <code>VPWR</code> to <code>VGND</code>: <b>latch-up</b>. The design rules cap the distance from any transistor to a tap.</p>" +
      "<p><b>Endcaps</b> (" + nEnd + ") terminate the wells at both ends of every row; LibreLane uses <code>decap_3</code> for them.</p>" +
      "<h3>How it works</h3>" +
      "<p>A fixed pattern: an endcap at each row end, then taps in a checkerboard, one every " + fmt(um(TAPPITCH)) + " µm in a row, alternate rows offset by half that. The columns are " + fmt(um(TAPPITCH / 2)) + " µm apart: the configured 13 µm (<code>FP_TAPCELL_DIST</code>) rounded down to whole sites. The first and last rows take every column, having a neighbour on one side only.</p>" };
  STEPS[S.PDN] = { short: "Power", title: "Power distribution network", tool: "OpenROAD <code>pdngen</code>",
    body:
      "<p>The <b>power distribution network</b> (PDN) carries <code>VPWR</code> and <code>VGND</code> to every cell. Here it has two levels:</p>" +
      "<p><b>Follow-pin rails</b> on met1, " + fmt(um(RAILW)) + " µm wide, along every row boundary: " + nRail.VGND + " <code>VGND</code> and " + nRail.VPWR + " <code>VPWR</code>, alternating. They lie exactly over the cells' own power rails, so each cell connects by abutment, with no routing.</p>" +
      "<p><b>Stripes</b> on met4, " + fmt(um(STRW)) + " µm wide and vertical: " + nStripe / 2 + " pairs of <code>VPWR</code> and <code>VGND</code>, repeating every " + fmt(um(STRPITCH)) + " µm. They are also the tile's power pins. Tiny Tapeout reserves met5 for its chip-level power grid, which feeds each project's <code>VPWR</code> through a power switch (so a project can be turned off) and connects to these stripes.</p>" +
      "<p>Where a stripe crosses a rail of its own net, a <b>via stack</b> joins them: met1 to met2 to met3 to met4, each via an array of cuts. There are " + PDN.vias.length + ".</p>" +
      "<h3>How it works</h3>" +
      "<p><code>pdngen</code> builds the grid from a specification, not from the logic: which layers carry rails and stripes, with their widths, pitches and offsets (here Tiny Tapeout's, for a 1×1 tile). Met2 and met3 carry no power outside the via stacks, which leaves them free for signal routing.</p>" };
  STEPS[S.PINS] = { short: "Pins", title: "Pins", tool: "LibreLane <code>ApplyDEFTemplate</code>",
    body:
      "<p>Every Tiny Tapeout tile has the same " + PINS.length + " signal pins in the same places, so the chip-level routing can reach any project. All sit on the top edge, on met4, each " + fmt(um(PINW)) + " × " + fmt(um(PINH)) + " µm, " + fmt(um(PINPITCH)) + " µm apart:</p>" +
      "<p><code>clk</code>, <code>ena</code> and <code>rst_n</code>; <code>ui_in[7:0]</code>, the dedicated inputs; <code>uo_out[7:0]</code>, the dedicated outputs; and the bidirectional IOs, each with three pins: <code>uio_in</code> (in), <code>uio_out</code> (out) and <code>uio_oe</code> (output enable). This design leaves " + unusedList.length + " unused (" + busList(unusedList) + "): their pins are there, with nothing connected.</p>" +
      "<h3>How it works</h3>" +
      "<p>No algorithm: the step copies the pin shapes from Tiny Tapeout's template DEF. Without a fixed pin-out, OpenROAD's pin placer (<code>place_pins</code>) would choose positions that shorten the wiring, which is why LibreLane normally runs a rough global placement first. Here those steps are skipped.</p>" };
  STEPS[S.PLACE] = { short: "Place", title: "Global placement", tool: "OpenROAD <code>gpl</code> (RePlAce)", play: PLACE_MS,
    body:
      "<p><b>Global placement</b> gives each of the " + n(NC) + " instances a position that keeps connected cells close while spreading them evenly over the core. Positions are continuous: cells may overlap and sit between rows until legalisation.</p>" +
      "<h3>How it works</h3>" +
      "<p>Every instance starts at the core centre. <b>Initial placement</b> minimises a quadratic wirelength model by conjugate gradient (" + nIP + " iterations). With the pins, all on the top edge, as its only anchors, it pulls the netlist into a heap under them.</p>" +
      "<p><b>Nesterov placement</b> then treats cells as charges in an electrostatic field that pushes them out of dense regions, against a smooth wirelength model pulling connected cells together; the density penalty rises as it goes. Density is measured on a " + BINS + " × " + BINS + " grid of <b>bins</b> against a <b>target density</b> of " + fmt(TARGET) + " (" + fmt(M.gpl.asked) + " was asked for; the tool raised it to fit its " + fmt(M.gpl.util, 0) + "% utilisation, which pads cells where pins are dense; unpadded, the cells fill " + fmt(100 * M.gpl.area / um(CORE[2] - CORE[0]) / um(CORE[3] - CORE[1]), 0) + "% of the core). <b>Overflow</b>, the movable cell area above the target as a share of all movable cell area, measures progress; the placer stops below 0.1.</p>" +
      "<p>The run is <b>routability-driven</b>: near 0.3 overflow it estimates congestion, inflates cells where it is high and rewinds to a snapshot taken at about 0.6. It did so " + LASTF.rounds + " times without reaching its congestion target, then kept the least congested round's inflation for the final pass.</p>",
    note: "Shown: the first descent, one rewind, the final pass." };
  STEPS[S.REPAIR] = { short: "Repair", title: "Repair design", tool: "OpenROAD <code>rsz</code>: <code>buffer_ports</code>, <code>repair_design</code>, <code>repair_tie_fanout</code>", play: 5000,
    body:
      "<p>With every cell placed, each net's wire length can be estimated, and with it the net's capacitance and the slew (transition time) at its pins. The resizer checks these against the design's limits (from the SDC: " + fmt(M.sdc.slew) + " ns slew, " + fmt(M.sdc.cap) + " pF, fanout " + M.sdc.fanout + ") and the library's pin limits, and repairs the violations, before any timing optimisation.</p>" +
      "<p><b>Input buffers</b> (" + M.rsz.inbuf + "): each input pin in use (" + M.inputs.map(function (x) { return "<code>" + x + "</code>"; }).join(", ").replace(/<code>ui_in\[0\]<\/code>.*<code>ui_in\[6\]<\/code>/, "<code>ui_in[6:0]</code>") + ") now drives one small buffer, which starts on its pin, mostly outside the die.</p>" +
      "<p><b>Buffering and sizing</b>: " + M.rsz.slew + " slew and " + M.rsz.fanout + " fanout violations, fixed by inserting " + M.rsz.buffers + " buffers into " + M.rsz.nets + " nets, which split heavy loads into trees, and by sizing up " + M.rsz.resized + " instances.</p>" +
      "<p><b>Tie cells</b>: constant 0s and 1s come from <code>conb_1</code> tie cells. Synthesis gave each of the " + nTie + " constant outputs its own, placed wherever global placement put it; <code>repair_tie_fanout</code> replaces each with a new one beside the pin it drives.</p>" +
      "<h3>How it works</h3>" +
      "<p>Each net's length comes from a Steiner tree over its pins, times the resistance and capacitance per µm averaged over met1 to met4. Where a limit is broken (with a " + M.sdc.slewpct + "% margin), <code>repair_design</code> inserts buffers or swaps in a stronger cell.</p>",
    note: "New cells pop in where the resizer put them, overlapping others until legalisation; the resized cells grow." };
  STEPS[S.LEGAL] = { short: "Legalise", title: "Detailed placement", tool: "OpenROAD <code>dpl</code>: <code>detailed_placement</code>, <code>optimize_mirroring</code>", play: 6500,
    body:
      "<p><b>Legalisation</b> moves every instance from its global position to a legal one: on a row, aligned to a site, overlapping nothing, taps and endcaps included. Each takes its row's orientation, N or FS. The moves are small (in a straight line, " + fmt(M.dpl.disp[3]) + " µm on average, " + fmt(M.dpl.disp[1]) + " µm at most) but they cost wirelength: HPWL rises " + Math.round(100 * (M.dpl.hpwl[1] / M.dpl.hpwl[0] - 1)) + "%, from " + n(Math.round(M.dpl.hpwl[0])) + " to " + n(Math.round(M.dpl.hpwl[1])) + " µm.</p>" +
      "<p>Then <code>optimize_mirroring</code> flips instances left to right (FN or S) where that shortens their nets: " + n(M.dpl.mirrored) + " of them, winning back " + fmt(100 * (1 - M.dpl.hpwl[2] / M.dpl.hpwl[1]), 1) + "% (to " + n(Math.round(M.dpl.hpwl[2])) + " µm).</p>" +
      "<h3>How it works</h3>" +
      "<p><code>dpl</code> searches outward from each cell's global position for the nearest free run of sites. Global placement has already spread the cells to the target density, so a free spot is never far. In LibreLane the repair step ends by legalising; the Detailed placement step after it finds nothing left to move.</p>",
    note: "All cells slide at once from their global positions to their legal ones; then the mirrored cells flip." };
  STEPS[S.CTS] = { short: "Clock", title: "Clock tree synthesis", tool: "OpenROAD <code>cts</code> (TritonCTS): <code>clock_tree_synthesis</code>", play: 8000,
    body:
      "<p>Until now <code>clk</code> was an ideal net, reaching all " + M.cts.sinks + " flip-flops at the same instant. As a real wire it would be far too heavily loaded, and the clock edge would reach near and far flip-flops at different times. That difference, <b>skew</b>, comes straight out of every timing path's budget.</p>" +
      "<p><b>Clock tree synthesis</b> replaces it with a tree of " + M.cts.buffers + " clock buffers (<code>clkbuf_4</code>): the root buffer, " + NBRANCH + " branch buffers and " + M.cts.clusters + " leaf buffers, so that every flip-flop is " + (M.cts.mindepth === M.cts.depth ? "exactly " + M.cts.depth : M.cts.mindepth + " to " + M.cts.depth) + " buffers from the pin.</p>" +
      "<h3>How it works</h3>" +
      "<p>TritonCTS first <b>clusters</b> the sinks: " + M.cts.sinks + " flip-flops into " + M.cts.clusters + " groups of at most " + M.cts.maxsinks + " close together, each driven by one leaf buffer. It then builds an <b>H-tree</b> over the clusters: a symmetric trunk, halved at each level, that gives the branches matched lengths. " + M.cts.dummies + " <b>dummy loads</b>, clock cells whose outputs drive nothing, even out the load on the branches. The nets at the top of the tree, " + M.cts.ndr.map(function (x) { return "<code>" + x + "</code>"; }).join(" and ") + ", get a non-default rule, double spacing, to cut coupling.</p>" +
      "<p>The buffers go where the tree wants them; then legalisation makes room, moving " + M.cts.disp[2] + " cells " + fmt(M.cts.disp[3], 1) + " µm on average.</p>",
    note: "Lines join each clock net's driver to its loads, level by level from the pin, thinner at each level down to the flip-flops." };
  STEPS[S.HOLD] = { short: "Hold", title: "Hold repair", tool: "OpenROAD <code>rsz</code>: <code>repair_timing -hold</code>", play: 6000,
    body:
      "<p>With the clock tree built, timing analysis uses real clock arrival times, so hold can be checked meaningfully. A <b>hold violation</b> is a path so fast that new data reaches a flip-flop before it has finished capturing the old: the data must stay stable for a short time after the clock edge, and skew can shorten that window further.</p>" +
      "<p>Setup was checked first and had no violations. For hold, " + M.hold.endpoints + " endpoints needed fixing, the worst at " + fmt(M.hold.wns[0], 3) + " ns of slack, counting " + fmt(M.sdc.uncertainty) + " ns of clock uncertainty. The resizer fixed them with <b>delay cells</b> (<code>dlygate4sd3_1</code>, a buffer built to be slow): " + M.hold.buffers + " of them, adding " + M.hold.area.replace("+", "") + " to cell area, until every endpoint has at least the " + fmt(M.hold.margin) + " ns hold margin.</p>" +
      "<h3>How it works</h3>" +
      "<p><code>repair_timing</code> works from the worst endpoint up, inserting a delay cell into each violating path and checking each insertion against setup on the same paths. Then legalisation makes room, moving " + M.hold.disp[2] + " cells " + fmt(M.hold.disp[3], 1) + " µm on average, and the mirroring is optimised again.</p>",
    note: "Delay cells pop in where the resizer put them; then legalisation makes room." };
  STEPS[S.GRT] = { short: "Route", title: "Global routing", tool: "OpenROAD <code>grt</code> (FastRoute)", play: 13000,
    body:
      "<p><b>Global routing</b> plans every net's route before any wire is drawn. It lays a grid of <b>g-cells</b> over the die (" + fmt(um(GG)) + " µm, " + GNX + " × " + GNY + ", the last column and row a little wider) and, for each of the " + n(GR.routed) + " nets, picks the g-cells its wires will pass through and a layer in each: the net's <b>route guides</b>, a corridor for detailed routing.</p>" +
      "<p>Its job is to keep every g-cell edge within capacity. Only so many wires fit across an edge, one per track (" + Math.floor(TRACKS[GLAY.indexOf("met1")]) + " on met1, " + Math.floor(TRACKS[GLAY.indexOf("met4")]) + " on met4), less a " + GR.adjust + "% margin and what the power grid blocks; where too many nets would cross, the router detours some through quieter g-cells. The first pass did overflow; " + GR.extra + " more rounds of rip-up and reroute cleared it.</p>" +
      "<p>The last picture counts, for every g-cell, the nets with a guide in it: the stronger the colour, the busier. It shows where routing is dense, not the router's own measure, which counts the wires across each edge against its tracks.</p>" +
      "<p>Routing uses met1 to met4, alternating: met1 and met3 horizontal, met2 and met4 vertical; li1, the cells' pin layer, appears only where a pin is reached. Overall " + ["met1", "met2", "met3", "met4"].map(function (l) { return l + " uses " + fmt(GR.usage[l], 0) + "%"; }).join(", ") + " of its capacity.</p>" +
      "<h3>How it works</h3>" +
      "<p>FastRoute routes each net in two dimensions as a tree through g-cells, rips up and reroutes the nets through over-full edges until none remain, and then assigns each stretch a layer.</p>",
    note: "The guides of " + ROUTE_EX.length + " example nets, one at a time; then every net, as a count per g-cell." };
  STEPS[S.ANT] = { short: "Antenna", title: "Antenna repair", tool: "OpenROAD <code>grt</code>: <code>repair_antennas</code>", play: 6500,
    body:
      "<p>During fabrication the chip is built up layer by layer, and plasma etching charges every exposed wire. A wire that connects only to transistor gates has nowhere to discharge, and a long one can collect enough charge to damage the thin gate oxide: the <b>antenna effect</b>. In sky130 the rule limits the area of a wire's sidewalls (perimeter × thickness) on each layer relative to the gate area it connects to.</p>" +
      "<p>The check after global routing found one violation: net <code>" + AM.net + "</code> at <code>" + AM.pin + "</code> on " + AM.layer + ", ratio " + fmt(AM.partial) + " against a limit of " + fmt(AM.required, 0) + " (" + Math.round(100 * (AM.pr - 1)) + "% over). The clock pin's long route to the root buffer ends at a single gate.</p>" +
      "<p>The repair inserts one <b>antenna diode</b> (<code>diode_2</code>) beside the gate: a reverse-biased junction that gives the charge a safe path to the substrate and does nothing in normal operation. The check after detailed routing finds no violations.</p>" +
      "<h3>How it works</h3>" +
      "<p><code>repair_antennas</code> estimates each net's metal from its global route and adds diodes, or moves wiring to a higher layer, until every ratio passes. Placing the diode re-legalises the cells, which puts almost every cell back in its row's orientation, and LibreLane 3.0 does not mirror them again afterwards: " + n(AM.flipped) + " cells lose their mirroring here, at some cost in wirelength. The guides of " + n(AM.rerouted) + " nets are re-made, and detailed routing follows those.</p>",
    note: "The clk net's guides from the pin to the root buffer; the diode; then the cells that lose their mirroring flip back." };
  STEPS[S.DRT] = { short: "Detail", title: "Detailed routing", tool: "OpenROAD <code>drt</code> (TritonRoute)", play: 14000,
    body:
      "<p><b>Detailed routing</b> draws the actual wires: for every net, metal shapes on the routing tracks of each layer, joined by vias, following the net's route guides and obeying every width and spacing rule. The guide's layer is a preference: the router may move a stretch to another layer.</p>" +
      "<p>The result: " + n(DR.wirelength) + " µm of wire (" + ["met1", "met2", "met3", "met4"].map(function (l) { return l + " " + n(DR.length[l]); }).join(", ") + ") and " + n(DR.nvias) + " vias. The first pass left " + n(DR.iters[0]) + " design-rule violations; " + (DR.iters.length - 1) + " more passes brought them to " + DR.iters[DR.iters.length - 1] + ". It took " + runtimeText(DR.runtime) + ", the slowest step of the flow.</p>" +
      "<h3>How it works</h3>" +
      "<p>TritonRoute first works out how to reach each pin and assigns wires to tracks, then divides the die into small regions and routes each one's nets with a maze search, many regions in parallel. Each later pass rips up and reroutes only where violations remain, raising the cost of the shapes that cause them.</p>",
    note: "Three example nets' wires over the guides detailed routing followed, as antenna repair re-made them (the wires stay inside in plan view; net " + ROUTE_EX[0].name + " runs " + fmt(ROUTE_EX[0].offlayer, 1) + " µm on another layer than planned); then all the wiring, shown layer by layer. Vias show when zoomed in." };
  STEPS[S.FILL] = { short: "Fill", title: "Fill insertion", tool: "OpenROAD <code>dpl</code>: <code>filler_placement</code>", play: 4000,
    body:
      "<p>Every empty site now gets a cell: " + n(FILL.length) + " of them. <b>Fill cells</b> (" + Object.keys(FILLT).filter(function (t) { return /^fill/.test(t); }).sort().map(function (t) { return "<code>" + t + "</code> × " + FILLT[t]; }).join(", ") + ") hold no transistors: they continue the wells, implants and power rails across the gaps, so every row is unbroken. Where there is room, <b>decap cells</b> (<code>decap_3</code> × " + (FILLT.decap_3 || 0) + ") go in instead: capacitors between <code>VPWR</code> and <code>VGND</code> that steady the supply when nearby cells switch.</p>" +
      "<p>That completes the layout. The flow then extracts the parasitics, checks timing again on the routed design, and writes the GDS for the final DRC and LVS checks.</p>" +
      "<h3>How it works</h3>" +
      "<p><code>filler_placement</code> walks each row and fills each gap from the cells it is given, largest first.</p>",
    note: "Fill cells hatched, decap cells solid." };
  STEPS[S.STA] = { short: "Timing", title: "Signoff timing", tool: "OpenROAD <code>rcx</code> (OpenRCX), <code>sta</code> (OpenSTA)", play: 9000,
    body:
      "<p><b>Parasitic extraction</b> works out each wire's resistance and capacitance from its geometry; <b>static timing analysis</b> then checks every path against the clock with them, in " + CORNERS.length + " corners: slow, typical and fast process, voltage and temperature, each with minimum, nominal and maximum parasitics. No corner violates setup or hold.</p>" +
      "<p><b>Setup</b> is tightest in the slow corner (" + cornerName("max_ss_100C_1v60") + "). The worst register-to-register path runs from <code>" + PSETUP.q.start + "</code> through " + PSETUP.between + " cells to <code>" + PSETUP.q.end + "</code>: data arrives at " + fmt(PSETUP.t1) + " ns, required by " + fmt(PSETUP.q.required) + " ns (the next clock edge at the capture flip-flop, less " + fmt(-PSETUP.q.uncertainty) + " ns uncertainty and " + fmt(-PSETUP.q.libtime) + " ns setup time, plus " + fmt(PSETUP.q.crpr, 3) + " ns CRPR): slack " + fmt(PSETUP.q.slack) + " ns. Counting input and output paths, the worst is " + fmt(ST.worst.slack) + " ns, from <code>" + ST.worst.start + "</code>.</p>" +
      "<p><b>Hold</b> is tightest in the fast corner (" + cornerName("min_ff_n40C_1v95") + "). <code>" + PHOLD.q.start + "</code> feeds itself back through " + PHOLD.between + " cells: the new value arrives at " + fmt(PHOLD.t1, 3) + " ns, allowed from " + fmt(PHOLD.q.required, 3) + " ns (the clock edge plus " + fmt(PHOLD.q.uncertainty) + " ns uncertainty and the hold time, " + (PHOLD.q.libtime < 0 ? "−" : "") + fmt(Math.abs(PHOLD.q.libtime), 3) + " ns, less " + fmt(-PHOLD.q.crpr, 3) + " ns CRPR): slack " + fmt(PHOLD.q.slack, 3) + " ns.</p>" +
      "<h3>How it works</h3>" +
      "<p>No test vectors: OpenSTA propagates the latest and earliest arrival times through every cell and net, from the library's delay tables and each wire's extracted RC. Every delay is derated ±" + fmt(ST.derate, 0) + "% for on-chip variation; where launch and capture share part of the clock tree, <b>clock reconvergence pessimism removal</b> (CRPR) takes back what that counts twice. Up to " + slewMax("ss") + " pins exceed the slew limit in the slow corners and " + slewMax("tt") + " in the typical: warnings.</p>",
    note: "Each path's signal travels at its real arrival times." };
  STEPS[S.IR] = { short: "IR drop", title: "IR drop analysis", tool: "OpenROAD <code>psm</code> (PDNSim)", play: 7000,
    body:
      "<p>The power grid has resistance, so the supply sags on its way to the cells: a cell far from where power enters sees a little less than 1.8 V on <code>VPWR</code>, and a little more than 0 V on <code>VGND</code>. Too much <b>IR drop</b> slows cells down and can break timing.</p>" +
      "<p>This design draws an estimated " + fmt(IR.power * 1000, 2) + " mW (typical corner, default switching activity), so the drop is tiny: at worst " + fmt(IR.worst[0], 1) + " µV on <code>VPWR</code> and " + fmt(IR.worst[1], 1) + " µV on <code>VGND</code>, about " + fmt(IR.worst[0] / 18000, 4) + "% of the supply; " + fmt(IR.average[0], 0) + " µV on average. It is largest at the far ends of the rails, beyond the outermost met4 stripes, and smallest beside the stripes, where power enters the rails.</p>" +
      "<h3>How it works</h3>" +

        if (wireLayerAt(tw, VIALAYER[VRAW[5 * vk + 4]]) <= 0) continue;
        var vx = u16(VRAW, 5 * vk) * 5, vy = u16(VRAW, 5 * vk + 2) * 5;
        if (Math.abs(x - vx) <= Math.max(85, tol) && Math.abs(y - vy) <= Math.max(85, tol))
          hits.push(["wvia", "<b>Via</b> <code>" + DR.vtypes[VRAW[5 * vk + 4]] + "</code>, net <code>" + GR.nets[netAt(VSTART, vk)] + "</code>"]);
      }
      for (var k = 0; k < NW; k++) {
        var l2 = WRAW[9 * k + 8];
        if (wireLayerAt(tw, l2) <= 0) continue;
        var b9 = 9 * k, ax = u16(WRAW, b9) * 5, ay = u16(WRAW, b9 + 2) * 5, bx = u16(WRAW, b9 + 4) * 5, by = u16(WRAW, b9 + 6) * 5;
        var hw = Math.max(WIDTH[l2] / 2, tol);
        if (x >= Math.min(ax, bx) - hw && x <= Math.max(ax, bx) + hw && y >= Math.min(ay, by) - hw && y <= Math.max(ay, by) + hw) {
          hitSegs[k] = 1;
          var net = netAt(WSTART, k), key = net + ":" + l2;
          if (seen[key]) continue;
          seen[key] = 1;
          hits.push([WL[l2], "<b>" + WL[l2] + " wire</b>, net <code>" + GR.nets[net] + "</code>"]);
        }
      }
      // on the timing step: the path stages these wires carry, as far as the signal has got
      if (step === S.STA) [PSETUP, PHOLD].forEach(function (P) {
        var T = pos > S.STA - 1e-9 && !anim ? P.t1 : staTime(P, within(pos, S.STA));
        P.st.forEach(function (x2, i2) {
          var r2 = P.wires[i2];
          if (!r2 || x2.t > T || !Object.keys(hitSegs).some(function (q) { return r2.segs[q]; })) return;
          add(P.key, "<b>On the worst " + (P === PSETUP ? "setup" : "hold") + " path</b>: net <code>" + GR.nets[x2.ni] + "</code> from <code>" + x2.pin + "</code>, " + fmt(x2.t, 3) + " ns", "path");
        });
      });
      hits.slice(0, 5).forEach(function (hh) { add(hh[0], hh[1], "wire"); });
      if (hits.length > 5) add("wvia", "and " + (hits.length - 5) + " more wires and vias here", "wire");
    }
    // the clk route on the antenna step
    if (step === S.ANT) {
      for (var ci2 = GSTART[CLKNET]; ci2 < GSTART[CLKNET] + GR.count[CLKNET]; ci2++) {
        var gl0 = GRAW[5 * ci2 + 4];
        if (x >= gX(GRAW[5 * ci2]) && x < gX(GRAW[5 * ci2 + 2]) && y >= gY(GRAW[5 * ci2 + 1]) && y < gY(GRAW[5 * ci2 + 3])) { add(GLAY[gl0], "<b>Route guide of <code>" + AM.net + "</code></b>, " + GLAY[gl0], "antnet"); break; }
      }
    }
    // global routing: the g-cell
    if (step === S.GRT) {
      var gx = gCol(x), gy = gRow(y), parts = [];
      for (var li = 1; li < GLAY.length; li++) { var cv = COV[li][gy * GNX + gx]; if (cv) parts.push(cv + " on " + GLAY[li]); }
      add("hot", "<b>G-cell (" + gx + ", " + gy + ")</b>: guides of " + COVALL[gy * GNX + gx] + " nets" + (parts.length ? "<br>" + parts.join(", ") : ""), "route");
    }
    // the power grid
    if (pos > S.TAPS + 0.5) {
      PDN.vias.forEach(function (v) { if (Math.abs(x - v[1]) <= STRW / 2 && Math.abs(y - v[2]) <= Math.max(RAILW / 2, tol)) add("via", "<b>Via stack</b>, <code>" + v[0] + "</code>: met1 rail to met4 stripe", "pdn"); });
      PDN.stripes.forEach(function (st) { if (Math.abs(x - st[2]) <= st[5] / 2 && y >= st[3] && y <= st[4]) add(st[0] === "VPWR" ? "vpwr" : "vgnd", "<b><code>" + st[0] + "</code> stripe</b>, " + st[1] + ", " + fmt(um(st[5])) + " µm wide; a tile power pin", "pdn"); });
      PDN.rails.forEach(function (r) { if (Math.abs(y - r[1]) <= Math.max(r[4] / 2, tol / 2) && x >= r[2] && x <= r[3]) add(r[0] === "VPWR" ? "vpwr" : "vgnd", "<b><code>" + r[0] + "</code> follow-pin rail</b>, met1, " + fmt(um(r[4])) + " µm wide", "pdn"); });
    }
    // placement bins
    if (step === S.PLACE && inCore && cellsNow) {
      binDensity();
      var bi = Math.floor((x - CORE[0]) / binW), bj = Math.floor((y - CORE[1]) / binH), bd = binArea[bj * BINS + bi];
      add("hot", "<b>Bin density " + bd.toFixed(2) + "</b>" + (bd > TARGET ? ", over the target (" + fmt(TARGET) + ")" : " (target " + fmt(TARGET) + ")"), "hot");
    }
    // cells, topmost first; overlapping ones (before legalisation) up to three
    if (cellsNow && step !== S.IR) {
      var chits = [];
      for (var oi = NU - 1; oi >= 0; oi--) {
        var c2 = ORDER[oi];
        if (SA[c2] > 0.5 && x >= SX[c2] && x <= SX[c2] + SWD[c2] && y >= SY[c2] && y <= SY[c2] + RH) chits.push(c2);
      }
      chits.slice(0, 3).forEach(function (c3) {
        if (step === S.STA && ONPATH[c3]) ONPATH[c3].forEach(function (P) {
          var xs = P.st.filter(function (x) { return x.ci === c3; }).map(function (x) { return "<code>" + x.pin.split("/")[1] + "</code> " + fmt(x.t, 3) + " ns"; });
          add(P.key, "<b>On the worst " + (P === PSETUP ? "setup" : "hold") + " path</b>: " + xs.join(", "), "path");
        });
        add(CLS[c3], cellTip(c3), cellGroup(c3));
      });
      if (chits.length > 3) add("die", "and " + (chits.length - 3) + " more cells overlapping here", cellGroup(chits[3]));
    }
    if (pos > S.DRT && inCore && step !== S.IR) FILL.forEach(function (f) {
      if (f.row === row && site >= f.site && site < f.site + f.w) add(f.kind, "<b>" + (f.kind === "decap" ? "Decap cell" : "Fill cell") + "</b> <code>" + f.type + "</code>, " + f.w + (f.w === 1 ? " site" : " sites"), f.kind, f.kind === "fill");
    });
    if (pos > S.FLOOR + 0.5 && inCore && step !== S.IR) byRow[row].forEach(function (c4) {
      if (site >= c4.site && site < c4.site + c4.w)
        add(c4.kind === "tap" ? "tap" : "endcap", "<b>" + (c4.kind === "tap" ? "Well tap" : "Endcap") + "</b> <code>" + c4.name + "</code><br><code>" + c4.type + "</code>, " + c4.w + (c4.w === 1 ? " site" : " sites") + ", " + c4.orient + ", FIXED", "fixed");
    });
    // the row, or the margin, or the die
    if (step >= S.FLOOR && inCore) add(D.rows[row] ? "row-flip" : "row", "<b>ROW_" + row + "</b>, " + (D.rows[row] ? "FS: <code>VPWR</code> along the bottom" : "N: <code>VPWR</code> along the top") + "; site " + site + " of " + D.sitesPerRow + " (<code>unithd</code>)", "rows");
    else if (step >= S.FLOOR) add("die", "<b>Core margin</b>: die area outside the core; no standard cells");
    else add("die", "<b>Die area</b>: " + fmt(um(DIE[2] - DIE[0])) + " × " + fmt(um(DIE[3] - DIE[1])) + " µm");
    placeTip(items, px, py);
  }
  // In the GDS view: the layers under the pointer, topmost first, then the cell they belong to
  // and any pin
  function gdsTip(px, py, x, y, cellsNow) {
    gdsBuild();
    var u = within(pos, S.GDS), items = [];
    worldTransform();
    for (var i = GDS_ORDER.length - 1; i >= 0; i--) {
      var g = GDS_ORDER[i];
      if (pos <= S.GDS && gdsLayerAt(u, i) <= 0) continue;
      var hit = ctx.isPointInPath(GPATH[g.l], px * DPR, py * DPR) || (g.also || []).some(function (l2) { return ctx.isPointInPath(GPATH[l2], px * DPR, py * DPR); });
      if (hit) items.push({ c: g.c, h: "<b>" + g.what.replace(":", "</b>:") });
    }
    screenTransform();
    if (cellsNow) {
      for (var oi = NU - 1; oi >= 0; oi--) {
        var c = ORDER[oi];
        if (SA[c] > 0.5 && x >= SX[c] && x <= SX[c] + SWD[c] && y >= SY[c] && y <= SY[c] + RH) { items.push({ c: CLS[c], h: "In cell <code>" + NAMES[c] + "</code> (<code>" + shortName(D.types[STY[c]]) + "</code>)" }); break; }
      }
    }
    FILL.forEach(function (f) {
      var row = Math.floor((y - CORE[1]) / RH), site = Math.floor((x - CORE[0]) / SW);
      if (f.row === row && site >= f.site && site < f.site + f.w) items.push({ c: f.kind, h: "In a " + (f.kind === "decap" ? "decap" : "fill") + " cell (<code>" + shortName(f.type) + "</code>)", hatch: f.kind === "fill" });
    });
    PINS.forEach(function (q) { if (x >= q.x0 && x <= q.x1 && y >= q.y0 && y <= q.y1) items.push({ c: "pin", h: "Pin <code>" + q.name + "</code>" + (UNUSED[q.name] ? ", unused: nothing connects to it" : "") }); });
    if (!items.length) items.push({ c: "die", h: "No shapes here" });
    placeTip(items, px, py);
  }
  function placeTip(items, px, py) {
    tip.innerHTML = items.map(function (it) {
      return '<div class="it' + (it.dimmed ? " dimmed" : "") + '"><i class="sw" style="background:' + swatchBg(it) + (it.dimmed ? ";filter:grayscale(1);opacity:0.45" : "") + '"></i><div>' + it.h + "</div></div>";
    }).join("");
    tip.hidden = false;
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.max(4, Math.min(px + 14, W - tw - 6)) + "px";
    tip.style.top = Math.max(4, py + 16 + th > H ? py - th - 10 : py + 16) + "px";
  }

  document.addEventListener("themechange", function () { readColours(); draw(); });
  readColours();
  updatePanel();
  new ResizeObserver(resize).observe(view);
  resize();
  syncReadout();
}
</script>
</body>
